name: pgmlogger
version: '1.0.0'
main: com.github.rockymine.pgmlogger.PGMLogger
api-version: '1.13'
description: Logs player positions and events for CTW map analysis
author: rockymine
depend:
  - PGM

commands:
  pgmlogger:
    description: Toggle logging features
    usage: /pgmlogger <toggle|status|reload> [feature]
    aliases: [plog]

permissions:
  pgmlogger.admin:
    description: Allows use of pgmlogger commands
    default: op
